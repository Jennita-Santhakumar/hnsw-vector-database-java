# Single source of truth for dependency and plugin versions (also imported by buildSrc).

[versions]
junit = "5.14.4"
assertj = "3.27.7"
jqwik = "1.10.1"
spotless-plugin = "8.10.3"
# Spotless 8.10.x supports google-java-format up to 1.36.1; 1.37.0 fails inside Spotless.
google-java-format = "1.36.1"
spotbugs-plugin = "6.5.12"
spotbugs = "4.10.4"
jacoco = "0.8.15"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

# Gradle plugins, consumed as libraries by the buildSrc convention plugin.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
