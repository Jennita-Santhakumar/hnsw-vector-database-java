name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint:
    name: Lint (Spotless + SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle dependencies, wrapper and build cache between runs.
      - uses: gradle/actions/setup-gradle@v6
      - run: make lint
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/"

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: make check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Plain CLI rather than gitleaks-action: free for any account type, no license key.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile arrives in task 3.3; until then this job is a no-op instead of a failure.
      - name: Build image (no push)
        if: hashFiles('Dockerfile') != ''
        run: docker build --tag hnsw-vector-database-java:ci .
      - name: No Dockerfile yet
        if: hashFiles('Dockerfile') == ''
        run: echo "No Dockerfile yet (added in task 3.3); skipping image build."
